var LET=["ㄱ","ㄴ","ㄷ","ㄹ"], CIR=["①","②","③","④","⑤"];
function rnd(n){return Math.floor(Math.random()*n)}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function wpick(ws){var s=0,i;for(i=0;i<ws.length;i++)s+=ws[i];var r=Math.random()*s;for(i=0;i<ws.length;i++){r-=ws[i];if(r<0)return i}return ws.length-1}
function yr(y){return y<0?"기원전 "+(-y)+"년":y+"년"}
function strictLongest(opts,a){var l=opts[a].length;for(var i=0;i<opts.length;i++){if(i!==a&&opts[i].length>=l)return false}return true}

function mkCtx(sel){
  var items=[],pairs=[],events=[],i;
  for(i=0;i<ITEMS.length;i++)if(sel[ITEMS[i][0]])items.push(i);
  for(i=0;i<PAIRS.length;i++)if(sel[PAIRS[i][0]])pairs.push(i);
  for(i=0;i<EVENTS.length;i++)if(sel[EVENTS[i][2]])events.push(i);
  return {sel:sel,items:items,pairs:pairs,events:events,seen:{}};
}
function sameChapter(i){var out=[];for(var k=0;k<ITEMS.length;k++)if(k!==i&&ITEMS[k][0]===ITEMS[i][0])out.push(k);return out}

function genSingle(neg,lv,ctx){
  var P=ctx.items; if(!P.length)return null;
  for(var tr=0;tr<40;tr++){
    var i=P[rnd(P.length)],cand;
    if(lv>=3){cand=sameChapter(i)}
    else{
      var all=P.filter(function(k){return k!==i});
      var other=all.filter(function(k){return ITEMS[k][0]!==ITEMS[i][0]});
      cand=other.length>=4?other:(all.length>=4?all:sameChapter(i));
    }
    var d=shuf(cand).slice(0,4);
    var correct=neg?ITEMS[i][2]:ITEMS[i][1];
    var opts=[{s:correct,ok:true,k:i}].concat(d.map(function(k){return {s:neg?ITEMS[k][1]:ITEMS[k][2],ok:false,k:k}}));
    opts=shuf(opts);
    var texts=opts.map(function(o){return o.s}),a=0;
    for(var x=0;x<5;x++)if(opts[x].ok)a=x;
    if(tr<39&&strictLongest(texts,a))continue;
    var why=[];
    if(neg){
      why.push("정답은 "+CIR[a]+"번(틀린 설명)이에요. 옳게 고치면 → "+ITEMS[i][1]);
      why.push("나머지 보기는 모두 옳은 설명이에요.");
    }else{
      why.push("정답은 "+CIR[a]+"번이에요. 나머지는 이렇게 고쳐야 해요.");
      opts.forEach(function(o,x){if(!o.ok)why.push(CIR[x]+" → 옳게 고치면: "+ITEMS[o.k][1])});
    }
    return {stem:neg?"다음 중 옳지 않은 것은?":"다음 중 옳은 것은?",box:[],opts:texts,a:a,why:why,key:(neg?"F":"T")+i,lv:lv};
  }
  return null;
}

function maskStr(m,n){var r=[];for(var i=0;i<n;i++)if(m&(1<<i))r.push(LET[i]);return r.join(", ")}
function popc(m){var c=0;while(m){c+=m&1;m>>=1}return c}
function genCombo(n,neg,lv,ctx){
  var P=ctx.items; if(!P.length)return null;
  var chs=[];P.forEach(function(k){if(chs.indexOf(ITEMS[k][0])<0)chs.push(ITEMS[k][0])});
  var picks;
  if(lv===5&&chs.length>1&&Math.random()<0.35){picks=shuf(P).slice(0,n)}
  else{
    var c=chs[rnd(chs.length)];
    var pc=P.filter(function(k){return ITEMS[k][0]===c});
    if(pc.length<n)pc=P;
    picks=shuf(pc).slice(0,n);
  }
  var m=1+wpick(n===4?[1,3,3,1]:[2,3,1]);
  var idx=shuf([0,1,2,3].slice(0,n)).slice(0,m),S=0;
  idx.forEach(function(x){S|=(1<<x)});
  var truth=[],texts=[];
  for(var p=0;p<n;p++){
    var inS=(S&(1<<p))>0;
    var isTrue=neg?!inS:inS;
    truth.push(isTrue);
    texts.push(isTrue?ITEMS[picks[p]][1]:ITEMS[picks[p]][2]);
  }
  var full=(1<<n)-1,set={},list=[];
  set[S]=1;list.push(S);
  var tog=shuf([0,1,2,3].slice(0,n));
  for(var t=0;t<tog.length&&list.length<4;t++){var mm=S^(1<<tog[t]);if(mm!==0&&!set[mm]){set[mm]=1;list.push(mm)}}
  var guard=0;
  while(list.length<5&&guard++<200){var r=1+rnd(full);if(!set[r]){set[r]=1;list.push(r)}}
  list.sort(function(a,b){var pa=popc(a),pb=popc(b);if(pa!==pb)return pa-pb;
    for(var q=0;q<n;q++){var ba=(a>>q)&1,bb=(b>>q)&1;if(ba!==bb)return bb-ba}return 0});
  var a=list.indexOf(S);
  var box=texts.map(function(s,q){return LET[q]+". "+s});
  var why=["정답은 "+CIR[a]+"번("+maskStr(S,n)+")이에요."];
  for(var q2=0;q2<n;q2++){
    var good=neg?!truth[q2]:truth[q2];
    if(truth[q2]){why.push(LET[q2]+" 옳은 설명이에요.")}
    else{why.push(LET[q2]+" 틀린 설명이에요 → 옳게 고치면: "+ITEMS[picks[q2]][1])}
  }
  return {stem:neg?"다음 설명 중 옳지 않은 것만을 있는 대로 고른 것은?":"다음 설명 중 옳은 것만을 있는 대로 고른 것은?",
    box:box,opts:list.map(function(x){return maskStr(x,n)}),a:a,why:why,
    key:"C"+(neg?"n":"p")+picks.slice().sort().join(",")+"|"+truth.join(""),lv:lv};
}

function genSeq(n,first,lv,ctx){
  var E=ctx.events.slice().sort(function(a,b){return EVENTS[a][0]-EVENTS[b][0]});
  if(E.length<(first?5:n))return null;
  var pick;
  if(first){pick=shuf(E).slice(0,5)}
  else if(lv>=4&&E.length>=n+3){var s=rnd(E.length-(n+3)+1);pick=shuf(E.slice(s,s+n+3)).slice(0,n)}
  else pick=shuf(E).slice(0,n);
  var years=pick.map(function(k){return EVENTS[k][0]});
  if(first){
    var ord=shuf(pick),a=0,min=1e9;
    ord.forEach(function(k,x){if(EVENTS[k][0]<min){min=EVENTS[k][0];a=x}});
    var why=["정답은 "+CIR[a]+"번이에요. 연도를 보면:"];
    pick.slice().sort(function(x,y){return EVENTS[x][0]-EVENTS[y][0]}).forEach(function(k){why.push(EVENTS[k][1]+" — "+yr(EVENTS[k][0]))});
    return {stem:"다음 중 가장 먼저 일어난 일은?",box:[],opts:ord.map(function(k){return EVENTS[k][1]}),a:a,why:why,key:"S"+pick.slice().sort().join(","),lv:lv};
  }
  var shown=shuf(pick);
  var correct=pick.slice().sort(function(x,y){return EVENTS[x][0]-EVENTS[y][0]}).map(function(k){return LET[shown.indexOf(k)]});
  var cs=correct.join(" → "),set={},list=[cs];set[cs]=1;
  var guard=0;
  while(list.length<5&&guard++<300){
    var perm=correct.slice();
    if(Math.random()<0.6){var i=rnd(n-1),t=perm[i];perm[i]=perm[i+1];perm[i+1]=t}else perm=shuf(perm);
    var s2=perm.join(" → ");if(!set[s2]){set[s2]=1;list.push(s2)}
  }
  list.sort();
  var a2=list.indexOf(cs);
  var why2=["정답은 "+CIR[a2]+"번이에요. 연도 순서:"];
  pick.slice().sort(function(x,y){return EVENTS[x][0]-EVENTS[y][0]}).forEach(function(k){why2.push(LET[shown.indexOf(k)]+". "+EVENTS[k][1]+" — "+yr(EVENTS[k][0]))});
  return {stem:"다음 사건을 일어난 순서대로 바르게 나열한 것은?",box:shown.map(function(k,x){return LET[x]+". "+EVENTS[k][1]}),opts:list,a:a2,why:why2,key:"Q"+pick.slice().sort().join(","),lv:lv};
}

function genPair(lv,ctx){
  var P=ctx.pairs; if(!P.length)return null;
  var p=P[rnd(P.length)],g=PAIRS[p][3];
  var others=[];
  for(var k=0;k<PAIRS.length;k++)if(k!==p&&PAIRS[k][2]!==PAIRS[p][2])others.push(k);
  var cand=lv===1?others.filter(function(k){return PAIRS[k][3]!==g}):others.filter(function(k){return PAIRS[k][3]===g});
  if(cand.length<4){var pad=shuf(others.filter(function(k){return cand.indexOf(k)<0}));cand=cand.concat(pad)}
  var d=shuf(cand).slice(0,4);
  var opts=shuf([p].concat(d));
  var a=opts.indexOf(p);
  var why=["정답은 "+CIR[a]+" "+PAIRS[p][2]+"이에요. "+PAIRS[p][1]+"."];
  opts.forEach(function(k,x){if(k!==p)why.push(CIR[x]+" "+PAIRS[k][2]+" = "+PAIRS[k][1])});
  return {stem:"다음 설명에 해당하는 것은?",box:[PAIRS[p][1]],opts:opts.map(function(k){return PAIRS[k][2]}),a:a,why:why,key:"P"+p,lv:lv};
}

var MIX={
 1:[["pair",7],["true",3]],
 2:[["pair",5],["true",3],["false",2]],

 5:[["c4",5],["c4n",2],["seq4",1.5],["seq3",0.5],["false",1],["pair",0.5]]
};
function make(lv,ctx,type){
  switch(type){
    case "pair":return genPair(lv,ctx);
    case "true":return genSingle(false,lv,ctx);
    case "false":return genSingle(true,lv,ctx);
    case "first":return genSeq(5,true,lv,ctx);
    case "seq3":return genSeq(3,false,lv,ctx);
    case "seq4":return genSeq(4,false,lv,ctx);
    case "c3":return genCombo(3,false,lv,ctx);
    case "c4":return genCombo(4,false,lv,ctx);
    case "c4n":return genCombo(4,true,lv,ctx);
  }
}
function genOne(lv0,ctx){
  var q=null,best=null;
  for(var tr=0;tr<30;tr++){
    var lv=lv0===0?1+rnd(5):lv0;
    var mix=MIX[lv],type=mix[wpick(mix.map(function(m){return m[1]}))][0];
    q=make(lv,ctx,type)||genSingle(false,lv,ctx)||genPair(lv,ctx);
    if(!q)return null;
    if(!ctx.seen[q.key]){best=q;break}
    if(!best)best=q;
  }
  q=best;ctx.seen[q.key]=1;return q;
}

  $("n").value=ST.n;
  var c=ST.sel.filter(Boolean).length;
  $("sumry").textContent=LVN[ST.lv]+" · "+ST.n+"문제 · "+(c===CH.length?"전체 범위":c+"개 단원");
}
document.querySelectorAll(".qn").forEach(function(b){b.onclick=function(){ST.n=+b.dataset.n;save();drawSet()}});
$("n").oninput=function(){var v=parseInt($("n").value,10);if(v>0){ST.n=Math.min(200,v);save()}};
document.querySelectorAll(".pre").forEach(function(b){b.onclick=function(){
  var p=b.dataset.p;ST.sel=CH.map(function(_,i){return p==="all"?true:p==="none"?false:p==="gr"?(i>=2&&i<=5):p==="mid"?(i>=6&&i<=10):i===11});
  save();drawSet()}});
function readN(){var v=parseInt($("n").value,10);if(!(v>0))v=20;v=Math.min(200,v);ST.n=v;save();return v}
function gen(append){
  var n=readN();
  if(!ST.sel.some(Boolean)){$("msg").textContent="범위를 하나 이상 골라 주세요.";return}
  $("msg").textContent="";
  if(!append||!ST.ctx||ST.ctx.sel.join()!==ST.sel.join()){ST.ctx=mkCtx(ST.sel.slice());if(!append){ST.qs=[];ST.ans=[]}}
  for(var i=0;i<n;i++){var q=genOne(ST.lv,ST.ctx);if(q){ST.qs.push(q);ST.ans.push(null)}}
  startView();
}
function startView(){
  $("quiz").style.display="block";$("set").open=false;$("more").style.display="block";
  drawSet();render();$("quiz").scrollIntoView({behavior:"smooth",block:"start"});
}
function render(){
  var L=$("list");L.innerHTML="";
  ST.qs.forEach(function(q,i){
    var c=el("div","q");c.id="q"+i;
    var h=el("div","qh");h.appendChild(el("span",null,"문제 "+(i+1)));h.appendChild(el("span","badge",LVN[q.lv]));c.appendChild(h);
    c.appendChild(el("p","stem",q.stem));
    if(q.box.length){var b=el("div","box");q.box.forEach(function(t){b.appendChild(el("div",null,t))});c.appendChild(b)}
    var bs=[];
    q.opts.forEach(function(o,k){var b=el("button","opt",CIR[k]+" "+o);b.onclick=function(){pick(i,k)};c.appendChild(b);bs.push(b)});
    var w=el("div","why");c.appendChild(w);
    L.appendChild(c);
    if(ST.ans[i]!=null)paint(i);
  });
  upd();
}
function pick(i,k){if(ST.ans[i]!=null)return;ST.ans[i]=k;paint(i);upd()}
function paint(i){
  var q=ST.qs[i],k=ST.ans[i],c=$("q"+i),bs=c.querySelectorAll(".opt"),w=c.querySelector(".why");
  bs.forEach(function(b,x){b.disabled=true;if(x===q.a)b.classList.add("ok");else if(x===k)b.classList.add("bad")});
  w.innerHTML="";var good=k===q.a;
  w.appendChild(el("p","h "+(good?"ok":"bad"),good?"정답이에요!":"틀렸어요. 내 답 "+CIR[k]+" → 정답 "+CIR[q.a]));
  q.why.forEach(function(t){w.appendChild(el("p",null,t))});
  w.classList.add("show");
}
function stat(){var d=0,o=0;ST.qs.forEach(function(q,i){if(ST.ans[i]!=null){d++;if(ST.ans[i]===q.a)o++}});return {d:d,o:o,n:ST.qs.length}}
function upd(){
  var s=stat();$("b1").textContent="푼 문제 "+s.d+"/"+s.n;$("b2").textContent="정답 "+s.o;$("pg").style.width=(s.n?s.d/s.n*100:0)+"%";
  $("sumt").textContent=s.d===s.n&&s.n?("결과: "+s.n+"문제 중 "+s.o+"개 정답 ("+Math.round(s.o/s.n*100)+"%)"):("지금까지 "+s.d+"문제 중 "+s.o+"개 정답");
  $("rw").style.display=(s.d-s.o>0)?"":"none";
}
function buildText(){
  var s=stat(),t=[];
  t.push("[서양사 문제 뽑기 결과] 난이도 "+LVN[ST.lv]+" · 푼 "+s.d+"문제 중 정답 "+s.o+"개 (총 "+s.n+"문제)");
  var sc=[];ST.sel.forEach(function(v,i){if(v)sc.push(CH[i])});t.push("범위: "+(sc.length===CH.length?"전체":sc.join(", ")));
  t.push("");t.push("[틀린 문제]");
  var w=0;
  ST.qs.forEach(function(q,i){
    var k=ST.ans[i];if(k==null||k===q.a)return;w++;
    t.push(""+(i+1)+"번 ("+LVN[q.lv]+") "+q.stem);
    q.box.forEach(function(b){t.push("  "+b)});
    q.opts.forEach(function(o,x){t.push("  "+CIR[x]+" "+o)});
    t.push("  내 답 "+CIR[k]+" / 정답 "+CIR[q.a]);
    q.why.forEach(function(x){t.push("  · "+x)});
    t.push("");
  });
  if(!w)t.push("없음");
  var un=[];ST.qs.forEach(function(q,i){if(ST.ans[i]==null)un.push(i+1)});
  if(un.length)t.push("[안 푼 문제] "+un.join(", ")+"번");
  return t.join("\n");
}
$("cp").onclick=function(){
  var t=buildText(),o=$("out"),cm=$("cm");$("outbox").style.display="block";o.value=t;
  function fb(){o.focus();o.select();cm.textContent="복사가 안 되면 선택된 글을 길게 눌러 직접 복사해 주세요."}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){cm.textContent="복사됐어요. 채팅에 붙여넣어 주세요."},fb)}else fb();
};
$("rw").onclick=function(){
  var nq=[];ST.qs.forEach(function(q,i){if(ST.ans[i]!=null&&ST.ans[i]!==q.a)nq.push(q)});
  if(!nq.length)return;ST.qs=nq;ST.ans=nq.map(function(){return null});ST.ctx=null;render();window.scrollTo({top:0,behavior:"smooth"});
};
$("go").onclick=function(){gen(false)};
$("more").onclick=function(){gen(true)};
$("more2").onclick=function(){gen(true)};
drawSet();
</script>

</html>
